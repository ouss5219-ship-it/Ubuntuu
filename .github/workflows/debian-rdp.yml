      - name: Start Debian 13 XFCE RDP
        run: |
          RDP_PASSWORD=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 16)

          docker run -d \
            --name debian-rdp \
            --restart unless-stopped \
            -e RDP_PASSWORD="$RDP_PASSWORD" \
            -p 3389:3389 \
            debian:13 \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y \
                xfce4 \
                xfce4-goodies \
                xrdp \
                xorgxrdp \
                dbus-x11 \
                sudo \
                openssh-client \
                curl \
                wget \
                ca-certificates

              useradd -m -s /bin/bash user
              echo "user:${RDP_PASSWORD}" | chpasswd
              adduser user sudo

              echo "startxfce4" > /home/user/.xsession
              chown user:user /home/user/.xsession

              service dbus start
              service xrdp start

              tail -f /dev/null
            '

          echo "======================================"
          echo "RDP USER: user"
          echo "RDP PASSWORD: $RDP_PASSWORD"
          echo "======================================"
